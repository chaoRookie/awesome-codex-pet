name: Sync request catalog

on:
  issues:
    types: [opened, edited, labeled, unlabeled, closed, reopened, assigned]
  issue_comment:
    types: [created, edited, deleted]
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

concurrency:
  group: sync-request-catalog
  cancel-in-progress: false

permissions:
  actions: write
  contents: write
  issues: read

jobs:
  sync:
    if: >-
      github.event_name != 'issue_comment' ||
      contains(github.event.issue.labels.*.name, 'type: request')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v7
        with:
          ref: main

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.28.2

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Publish fresh request catalog
        id: publish
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/publish-generated-snapshot.mjs requests

      - name: Refresh site and request statistics
        if: steps.publish.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # GITHUB_TOKEN pushes do not trigger push workflows. Route the explicit
          # refresh through catalog generation before deploying the new snapshot.
          gh workflow run pet-previews.yml --ref main
          gh workflow run deploy-stats.yml --ref main
